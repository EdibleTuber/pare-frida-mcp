[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pare-frida-mcp"
version = "0.1.0"
description = "Frida dynamic-instrumentation MCP worker for PARE (Android v1)"
requires-python = ">=3.12"
dependencies = [
    "frida>=17",
    "mcp>=1.27.0,<2",   # 2.0 renamed streamablehttp_client; agent_core targets 1.x
    "pare-worker-kit @ git+https://github.com/EdibleTuber/pare-worker-kit.git@v0.1.1",   # RISK_TIER_META_KEY + run_worker; mcp-only, so a Pi stays small
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
pare-frida-mcp = "pare_frida_mcp.server:main"

[tool.hatch.metadata]
# Required for the pare-worker-kit git dependency above. Without it,
# hatchling refuses ANY direct URL reference and the package cannot be
# installed at all -- not "installs with a warning", but a hard
# metadata-generation failure on a clean checkout.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pare_frida_mcp"]

[tool.hatch.build]
exclude = [
    "src/pare_frida_mcp/agent/node_modules",
    "src/pare_frida_mcp/agent/src",
    "src/pare_frida_mcp/agent/package*.json",
    "src/pare_frida_mcp/agent/tsconfig.json",
    "src/pare_frida_mcp/agent/package-lock.json",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
